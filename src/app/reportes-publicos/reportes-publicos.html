<app-nav></app-nav>

<div class="public-container">

  <div class="public-header">
    <h1>Reportes de Infracciones en Tiempo Real</h1>
    <p>Mapa público de incidentes vial</p>
  </div>

  <div class="filter-card">
    <div class="filter-row">
      <label class="filter-label" for="filtroMes">
        <i class="fa-regular fa-calendar"></i> Mes
      </label>
      <select id="filtroMes" [(ngModel)]="mesSeleccionado" (ngModelChange)="onMesCambiado()">
        <option *ngFor="let mes of mesesDisponibles" [value]="mes.valor">{{ mes.etiqueta }}</option>
      </select>
      <span class="filter-count">{{ reportesFiltrados.length }} reporte{{ reportesFiltrados.length !== 1 ? 's' : '' }}</span>
    </div>
  </div>

  <div class="legend-card">
    <h3>Tipos de Infracciones</h3>
    <div class="legend-items">
      <div class="legend-item" *ngFor="let item of tiposConteo">
        <span class="legend-color" [style.background-color]="item.color"></span>
        <span class="legend-label">{{ item.tipo }}</span>
        <span class="legend-count">{{ item.cantidad }}</span>
      </div>
    </div>
  </div>

  <div class="map-card">
    <div id="map"></div>
  </div>

</div>
