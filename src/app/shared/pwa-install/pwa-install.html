<div class="pwa-overlay" *ngIf="visible && !yaInstalada" (click)="desestimar()"></div>

<div class="pwa-banner" *ngIf="visible && !yaInstalada" role="dialog" aria-label="Instalar aplicación">

  <button class="pwa-close" (click)="desestimar()" aria-label="Cerrar">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>

  <div class="pwa-body">
    <img class="pwa-icon" src="assets/images/icon-192.png" alt="Reportelo!" />

    <div class="pwa-info">
      <p class="pwa-titulo">Instala Reportelo!</p>
      <p class="pwa-subtitulo" *ngIf="!esIos">Accede más rápido desde tu pantalla de inicio, sin abrir el navegador.</p>
      <p class="pwa-subtitulo" *ngIf="esIos">
        Toca <strong>Compartir</strong>
        <svg class="ios-share-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
          <polyline points="16 6 12 2 8 6"/>
          <line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
        y luego <strong>"Agregar a inicio"</strong>
      </p>
    </div>
  </div>

  <div class="pwa-actions" *ngIf="!esIos">
    <button class="btn-ahora-no" (click)="desestimar()">Ahora no</button>
    <button class="btn-instalar" (click)="instalar()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Instalar app
    </button>
  </div>

  <div class="pwa-actions" *ngIf="esIos">
    <button class="btn-ahora-no" (click)="desestimar()">Entendido</button>
  </div>

</div>
